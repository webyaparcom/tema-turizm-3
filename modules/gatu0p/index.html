<style>
  /* sss-yatay-serit — sss-iki-sutun · sss-hap-vurgu · sss-cerceve dikey akordeon, sss-ikon-karo ızgarada satıra yayılır; bu modül yatay akordeon — kapalı sorular kitap sırtı gibi dikey yazılı şeritler, açılan şerit genişlikte büyür (flex-grow), cevap yan yana şeritler arasında açılır. */
  .modulex-sss-yatay-serit { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sss-yatay-serit *, .modulex-sss-yatay-serit *::before, .modulex-sss-yatay-serit *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sss-yatay-serit :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sss-yatay-serit :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sss-yatay-serit :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sss-yatay-serit :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sss-yatay-serit img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sss-yatay-serit) img { height: auto; }
  .modulex-sss-yatay-serit [hidden] { display: none !important; }
  .modulex-sss-yatay-serit :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sss-yatay-serit :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sss-yatay-serit-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sss-yatay-serit-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }

  .modulex-sss-yatay-serit-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sss-yatay-serit-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sss-yatay-serit-bas { max-width: 760px; }
  .modulex-sss-yatay-serit-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sss-yatay-serit-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }

  .modulex-sss-yatay-serit-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sss-yatay-serit-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sss-yatay-serit-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sss-yatay-serit { --yon: 1; }
  :is([dir="rtl"]) .modulex-sss-yatay-serit { --yon: -1; }
  .modulex-sss-yatay-serit-seritler { display: flex; gap: 10px; min-height: 400px; }
  .modulex-sss-yatay-serit-serit { flex: 1 1 0; min-width: 0; overflow: hidden; border-radius: --yuvarlak--; background-color: --vurguBg--; color: --vurguText--; transition: flex-grow 0.5s cubic-bezier(0.3, 0.7, 0.2, 1), background-color 0.3s ease; }

  .modulex-sss-yatay-serit-serit[open] { flex-grow: 5; background-color: --kartBg--; color: --text--; box-shadow: inset 0 4px 0 --accent--; }
  .modulex-sss-yatay-serit-sbas { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 22px 10px; list-style: none; font-weight: 700; }
  .modulex-sss-yatay-serit-sbas::-webkit-details-marker { display: none; }
  .modulex-sss-yatay-serit-sbas:focus-visible { outline-offset: -5px; }
  .modulex-sss-yatay-serit-serit:not([open]) .modulex-sss-yatay-serit-sbas { height: 100%; }
  .modulex-sss-yatay-serit-serit[open] .modulex-sss-yatay-serit-sbas { flex-direction: row; align-items: center; padding: 28px 30px 10px; }
  .modulex-sss-yatay-serit-sno { font-size: clamp(1.6rem, 2.6vw, 2.2rem); font-weight: 900; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .modulex-sss-yatay-serit-sikon { font-size: 26px; }
  .modulex-sss-yatay-serit-serit[open] :is(.modulex-sss-yatay-serit-sno, .modulex-sss-yatay-serit-sikon) { color: --accentInk--; }
  .modulex-sss-yatay-serit-syazi { line-height: 1.3; }
  .modulex-sss-yatay-serit-serit:not([open]) .modulex-sss-yatay-serit-syazi { flex: 1 1 0; min-height: 0; overflow: hidden; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 1.02rem; text-align: start; }
  .modulex-sss-yatay-serit-serit[open] .modulex-sss-yatay-serit-syazi { flex: 1 1 auto; min-width: 0; font-family: var(--mx-font-heading, inherit); font-size: clamp(1.25rem, 2vw, 1.6rem); font-weight: 800; letter-spacing: -0.01em; }
  .modulex-sss-yatay-serit-sgovde { display: grid; gap: 12px; max-width: 60ch; padding: 6px 30px 32px; animation: modulex-sss-yatay-serit-yana 0.45s ease both; }

  .modulex-sss-yatay-serit-cevap { color: inherit; font-size: 1.05rem; line-height: 1.75; }
  .modulex-sss-yatay-serit-serit[open] .modulex-sss-yatay-serit-cevap { color: --muted--; }
  @keyframes modulex-sss-yatay-serit-yana { from { opacity: 0; transform: translateX(calc(var(--yon) * 16px)); } to { opacity: 1; transform: none; } }
  @media (max-width: 1024px) {
    .modulex-sss-yatay-serit-seritler { min-height: 400px; gap: 8px; }

  }
  @media (max-width: 768px) {
    .modulex-sss-yatay-serit-seritler { flex-direction: column; min-height: 0; }
    /* sütun yönünde flex-basis 0 + overflow:hidden şeridi sıfır yüksekliğe çökertir → içerik kadar */
    .modulex-sss-yatay-serit-serit, .modulex-sss-yatay-serit-serit[open] { flex: none; }
    .modulex-sss-yatay-serit-serit:not([open]) .modulex-sss-yatay-serit-sbas { height: auto; flex-direction: row; padding: 16px 18px; }
    .modulex-sss-yatay-serit-serit:not([open]) .modulex-sss-yatay-serit-syazi { flex: 1 1 auto; overflow: visible; writing-mode: horizontal-tb; transform: none; }
    .modulex-sss-yatay-serit-serit[open] .modulex-sss-yatay-serit-sbas { padding: 20px 18px 8px; }
    .modulex-sss-yatay-serit-sno { font-size: 1.3rem; }
    .modulex-sss-yatay-serit-sgovde { padding: 4px 18px 22px; }
  }
  .modulex-sss-yatay-serit-bag { display: inline-flex; align-items: center; gap: 6px; margin-block-start: 10px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.25s ease; }
  .modulex-sss-yatay-serit-bag:hover { gap: 10px; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-sss-yatay-serit-bag .material-symbols-outlined { font-size: 18px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sss-yatay-serit :is(.modulex-sss-yatay-serit-baslik, .modulex-sss-yatay-serit-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sss-yatay-serit-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sss-yatay-serit { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sss-yatay-serit *, .modulex-sss-yatay-serit *::before, .modulex-sss-yatay-serit *::after { animation: none !important; transition: none !important; }
  }
</style>
