  .modulex-referans-yaka-kart-kordon { width: 14px; height: 46px; background: repeating-linear-gradient(180deg, --accent-- 0 6px, color-mix(in srgb, --accent-- 60%, --bg--) 6px 12px); clip-path: polygon(0 0, 100% 0, 78% 100%, 22% 100%); }

  .modulex-referans-yaka-kart-sarkac > .modulex-referans-yaka-kart-bag { position: relative; display: grid; justify-items: center; gap: 10px; width: 100%; max-width: 200px; padding: 18px 14px 16px; overflow: hidden; border: 1px solid --cizgi--; border-radius: 14px; background: --kartBg--; text-align: center; box-shadow: 0 20px 30px -24px color-mix(in srgb, --text-- 65%, transparent); }

  .modulex-referans-yaka-kart-yno { color: --muted--; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.74rem; letter-spacing: 0.06em; }
  .modulex-referans-yaka-kart-yizi { width: 72%; height: 18px; background: repeating-linear-gradient(90deg, color-mix(in srgb, --text-- 70%, transparent) 0 1px, transparent 1px 3px, color-mix(in srgb, --text-- 70%, transparent) 3px 5px, transparent 5px 7px); }
  .modulex-referans-yaka-kart-aski:hover .modulex-referans-yaka-kart-yad { color: --accentInk--; }

  @media (prefers-reduced-motion: reduce) {

<script>
  (() => {
    const P = "modulex-referans-yaka-kart";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
